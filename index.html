<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>DiplomaStudy — Learn Smart</title>
    
    <meta name="description" content="DiplomaStudy - Diploma in Engineering study app for BTEB students in Bangladesh." />
    <meta name="author" content="DiplomaStudy" />
    <meta name="keywords" content="Diploma, BTEB, Engineering, Bangladesh, Polytechnic" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="DiplomaStudy" />
    <meta property="og:description" content="Diploma Engineering study app for BTEB students." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bn_BD" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#1C3E2C" />
    
    <!-- Mobile & PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DiplomaStudy" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    
    <!-- ═══════════════════════════════════════
         STYLESHEETS — LAYOUT MUST BE LAST
         ═══════════════════════════════════════ -->
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/civil.css" />
    <link rel="stylesheet" href="./css/onboarding.css" />
    <link rel="stylesheet" href="./css/selection-modal.css" />
    <link rel="stylesheet" href="./css/content.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <!-- ⬇️⬇️⬇️ layout.css MUST BE LAST ⬇️⬇️⬇️ -->
    <link rel="stylesheet" href="./css/layout.css" />
  </head>
  
  <body>
    <!-- App Mount Point -->
    <div id="app">
      <div class="initial-loader">
        <div class="initial-loader-logo">DS</div>
        <div class="spinner"></div>
        <p class="initial-loader-text">DiplomaStudy</p>
        <p class="initial-loader-sub">Loading...</p>
      </div>
    </div>
    
    <!-- Toast Container -->
    <div id="toast-container"></div>
    
    <!-- ═══════════════════════════════════════
         GLOBAL ERROR HANDLER — shows errors on screen
         ═══════════════════════════════════════ -->
    <script>
      (function() {
        var errorShown = false;

        function showError(title, message, extra) {
          if (errorShown) return;
          errorShown = true;

          document.body.innerHTML = 
            '<div style="padding:20px;font-family:monospace;font-size:13px;background:#FEF3C7;color:#78350F;min-height:100vh;overflow:auto;">' +
              '<h2 style="color:#92400E;font-size:16px;margin:0 0 12px;">⚠️ ' + title + '</h2>' +
              '<p style="font-weight:700;margin:0 0 8px;word-break:break-word;">' + message + '</p>' +
              (extra ? '<pre style="background:#FFFFFF;padding:12px;border-radius:8px;font-size:11px;overflow:auto;white-space:pre-wrap;word-break:break-word;">' + extra + '</pre>' : '') +
              '<p style="font-size:12px;color:#92400E;margin-top:16px;">Screenshot পাঠান → fix দেওয়া হবে।</p>' +
            '</div>';
        }

        window.addEventListener("error", function(e) {
          var msg = e.message || "Unknown error";
          var file = e.filename ? e.filename.split("/").pop() : "";
          var line = e.lineno || "";
          var stack = (e.error && e.error.stack) ? e.error.stack : "";
          showError("JavaScript Error", msg + (file ? " (in " + file + (line ? ":" + line : "") + ")" : ""), stack);
        });

        window.addEventListener("unhandledrejection", function(e) {
          var reason = e.reason || {};
          var msg = reason.message || String(reason);
          var stack = reason.stack || "";
          showError("Promise Rejection", msg, stack);
        });

        setTimeout(function() {
          if (errorShown) return;
          var loader = document.querySelector(".initial-loader");
          if (loader && loader.parentNode) {
            showError(
              "App Load Timeout",
              "8 সেকেন্ড হয়ে গেছে কিন্তু app শুরু হয়নি।",
              "সম্ভবত:\n• main.js-এ কোনো import fail করছে\n• অথবা কোনো file missing\n\nConsole-এ details দেখুন।"
            );
          }
        }, 8000);
      })();
    </script>
    
    <!-- Main Entry Point -->
    <script type="module" src="./js/main.js"></script>
    
    <!-- Inline styles for initial loader -->
    <style>
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        padding: 40px 20px;
        text-align: center;
      }
      
      .initial-loader-logo {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        background: linear-gradient(135deg, #1C3E2C, #587858);
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.5px;
        margin-bottom: 20px;
        box-shadow: 0 8px 20px rgba(28, 62, 44, 0.2);
      }
      
      .initial-loader-text {
        font-size: 16px;
        font-weight: 700;
        color: #1C3E2C;
        margin-top: 16px;
        margin-bottom: 4px;
      }
      
      .initial-loader-sub {
        font-size: 12px;
        color: #84968B;
        font-weight: 500;
      }
      
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #E1E8E1;
        border-top-color: #1C3E2C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
