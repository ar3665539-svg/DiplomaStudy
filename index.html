<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DiplomaStudy</title>
    <meta name="description" content="Learn Smart. Prepare Better. Build Your Future. Mobile-first study and exam preparation app for Diploma-in-Engineering students in Bangladesh." />
    
    <!-- Open Graph & Social Meta -->
    <meta property="og:title" content="DiplomaStudy" />
    <meta property="og:description" content="Learn Smart. Prepare Better. Build Your Future. Mobile-first study and exam preparation app for Diploma-in-Engineering students in Bangladesh." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1C3E2C" />
    
    <!-- Mobile & PWA meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DiplomaStudy" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

    <!-- Pure CSS Foundation (No Frameworks, No Build Tools) -->
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <!-- Single Page Application Mount Point -->
    <div id="app">
      <div class="flex items-center justify-center p-xl" style="min-height: 80vh;">
        <div class="spinner"></div>
      </div>
    </div>
    <div id="toast-container"></div>

    <!-- Main ES Module Entry Point -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
